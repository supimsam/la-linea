<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Línea · Exercise library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8; --surface:#fff; --ink:#15181d; --ink-2:#4b5361; --ink-3:#8a919c;
    --line:#e6e8ec; --line-2:#d5d8de;
    --accent:#0f5c4a; --accent-soft:#e7f1ee;
    --ok:#1f7a4d; --ok-soft:#e6f4ec; --err:#b23a3a; --err-soft:#fbecec; --warn:#b8741a; --warn-soft:#fdf3e3;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .hide{display:none!important}

  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
  .brand i::after{content:"";position:absolute;left:7px;right:7px;top:13px;height:2px;background:#fff;border-radius:2px;box-shadow:0 -5px 0 #fff,0 5px 0 #fff}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-size:13px;font-weight:500;background:#fff}
  .seg button{padding:7px 11px;color:var(--ink-2)}
  .seg button.on{background:var(--ink);color:#fff}
  body.in-ex #seg{display:none}

  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
  .lead{color:var(--ink-2);max-width:56ch}
  .hero{padding:36px 0 24px}

  .cards{display:grid;gap:12px;padding-bottom:60px}
  @media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
  .card:hover{border-color:var(--ink-3)}
  .card .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .card b{font-size:16px;font-weight:600}
  .card p{font-size:14px;color:var(--ink-2)}
  .card .skill{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .card .skill span{font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;background:#f1f2f4;color:var(--ink-2)}

  /* exercise shell */
  .ex-top{display:flex;align-items:center;gap:14px;height:60px}
  .ex-top .x{color:var(--ink-3);display:flex}
  .ex-top .name{flex:1;font-size:14px;font-weight:600;color:var(--ink-2)}
  .ex-top .unit{font-size:12px;color:var(--ink-3)}
  .screen{padding:24px 0 140px;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .q{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:20px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
  .play{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
  .play.lg{width:72px;height:72px}
  .muted{font-size:14px;color:var(--ink-3)}

  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;text-align:left;font-weight:500;font-size:16px;display:flex;align-items:center;gap:12px;transition:border-color .12s,background .12s}
  .opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);font-size:12px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;font-weight:600}
  .opt:hover{border-color:var(--ink-3)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt.sel .k{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opt.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
  .opt.err{border-color:var(--err);background:var(--err-soft);box-shadow:inset 0 0 0 1px var(--err)}
  .opt:disabled{cursor:default}

  /* word tiles */
  .slot{min-height:64px;border-bottom:2px solid var(--line-2);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:18px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px}
  .tile{background:var(--surface);border:1px solid var(--line-2);border-bottom-width:3px;border-radius:10px;padding:10px 14px;font-weight:500;transition:transform .08s}
  .tile:active{transform:translateY(1px)}
  .tile.used{opacity:0;pointer-events:none}
  .slot.ok .tile{border-color:var(--ok);background:var(--ok-soft)} .slot.err .tile{border-color:var(--err);background:var(--err-soft)}

  /* ticket */
  .ticket{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:#fffdf5;border:1px solid #e8e1c8;border-radius:6px;padding:16px 18px;max-width:320px;margin:0 auto 18px;box-shadow:0 2px 6px rgba(0,0,0,.06);position:relative}
  .ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:6px;background:radial-gradient(circle,transparent 3px,#fffdf5 3.5px) 0 0/12px 6px}
  .ticket::before{top:-6px} .ticket::after{bottom:-6px;transform:rotate(180deg)}
  .ticket .hd{display:flex;justify-content:space-between;border-bottom:1px dashed #cfc7a8;padding-bottom:8px;margin-bottom:8px;font-weight:700}
  .ticket .li{display:flex;justify-content:space-between;padding:2px 0}
  .ticket .li i{font-style:normal;color:#8a7f5a;padding-left:12px;display:block;font-size:12px}
  .ticket .ft{border-top:1px dashed #cfc7a8;margin-top:8px;padding-top:8px;font-size:12px;color:#8a7f5a}

  /* dialogue */
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .msg{max-width:85%;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.4;animation:in .25s ease}
  .msg.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .msg.me{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .msg .who{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
  .msg .tr{display:block;font-size:12px;opacity:.6;margin-top:4px}

  /* hotspots */
  .map{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .map svg{width:100%;display:block}
  .hs{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--accent);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .12s}
  .hs:hover{transform:translate(-50%,-50%) scale(1.08)}
  .hs.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .hs.err{background:var(--err);border-color:var(--err);color:#fff;animation:shake .3s}
  @keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
  .target{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:center;margin-bottom:6px}

  /* sequence */
  .seq{display:grid;gap:8px;margin-bottom:16px}
  .seq .row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:12px 12px 12px 14px}
  .seq .row em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent);min-width:56px;text-transform:uppercase;letter-spacing:.06em}
  .seq .row span{flex:1;font-weight:500}
  .seq .row .mv{display:flex;flex-direction:column;gap:2px}
  .seq .row .mv button{width:30px;height:24px;border:1px solid var(--line-2);border-radius:6px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
  .seq .row.ok{border-color:var(--ok);background:var(--ok-soft)} .seq .row.err{border-color:var(--err);background:var(--err-soft)}

  /* rapid */
  .timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .timer i{display:block;height:100%;width:100%;background:var(--warn);transition:width .1s linear}
  .big-word{font-size:34px;font-weight:700;letter-spacing:-.03em;text-align:center;padding:30px 0;animation:in .2s}
  .score{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:8px;font-variant-numeric:tabular-nums}

  /* speaking */
  .mic{width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin:10px auto 14px;position:relative}
  .mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
  .heard{text-align:center;font-size:18px;min-height:28px;margin-bottom:6px}
  .field{width:100%;font:inherit;font-size:18px;font-weight:500;padding:14px 16px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field.ok{border-color:var(--ok)} .field.err{border-color:var(--err)}

  /* conjugation */
  .conj{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .conj td{padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
  .conj tr:first-child td{border-top:none}
  .conj td:first-child{color:var(--ink-2);width:40%}
  .conj input{width:100%;font:inherit;font-size:15px;font-weight:500;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;outline:none}
  .conj input:focus{border-color:var(--accent)}
  .conj input.ok{border-color:var(--ok);background:var(--ok-soft)} .conj input.err{border-color:var(--err);background:var(--err-soft)}
  .conj .given{font-weight:600}

  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:9}
  .bar .wrap{display:flex;align-items:center;gap:14px;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .bar.ok{background:var(--ok-soft);border-color:#cfe7d8} .bar.err{background:var(--err-soft);border-color:#f0cfcf}
  .fb{flex:1;min-width:0}
  .fb b{display:block;font-weight:600}
  .bar.ok .fb b{color:var(--ok)} .bar.err .fb b{color:var(--err)}
  .fb span{font-size:14px;color:var(--ink-2)}
  .btn{background:var(--accent);color:#fff;font-weight:600;padding:13px 22px;border-radius:10px;min-width:130px}
  .btn:disabled{opacity:.35;cursor:default}
  .bar.err .btn{background:var(--err)} .bar.ok .btn{background:var(--ok)}
</style>
</head>
<body>
<header><div class="wrap">
  <button class="brand" onclick="goHub()"><i></i><span>La Línea</span></button>
  <div class="seg" id="seg"><button class="on" data-l="en">English</button><button data-l="es">Español</button></div>
</div></header>

<main id="hub" class="wrap">
  <section class="hero">
    <div class="eyebrow" id="h-eye"></div>
    <h1 id="h-title"></h1>
    <p class="lead" id="h-lead"></p>
  </section>
  <div class="cards" id="cards"></div>
</main>

<div id="ex" class="hide">
  <div class="wrap ex-top">
    <button class="x" onclick="goHub()" aria-label="Exit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="name" id="exName"></div><div class="unit" id="exUnit"></div>
  </div>
  <div class="wrap"><div id="screen" class="screen"></div></div>
  <div class="bar" id="bar"><div class="wrap"><div class="fb" id="fb"></div><button class="btn" id="primary"></button></div></div>
</div>

<script>
/* ============ shared ============ */
let target="en"; const native=()=>target==="en"?"es":"en";
const VOICE={en:"en-US",es:"es-MX"};
const $=s=>document.querySelector(s), shuffle=a=>[...a].sort(()=>Math.random()-.5);
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();
const SPK=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>`;
function speak(txt,lang=target){ if(!("speechSynthesis" in window))return; const u=new SpeechSynthesisUtterance(txt);u.lang=VOICE[lang];u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u); }

/* UI strings keyed by NATIVE language */
const UI={
  es:{eye:"Biblioteca de ejercicios · Demo",title:"Tipos de ejercicio",lead:"Cada tipo de ejercicio aparece en distintas lecciones del curso. Tócalo para probarlo. Todos funcionan en ambas direcciones.",
      check:"Comprobar",next:"Continuar",done:"Listo",correct:"Correcto",incorrect:"Respuesta correcta:",tryAgain:"Intentar de nuevo",back:"Volver",
      tap:"Toca las palabras en orden",tapHint:"Toca una palabra colocada para devolverla.",
      ticket:"Lee la comanda",dlg:"Elige tu respuesta",map:"Toca la estación",seqq:"Ordena los pasos",rapid:"Toca la traducción antes de que se acabe el tiempo",dict:"Escucha y escribe",speak:"Di la frase en voz alta",conjq:"Completa la tabla",
      heardNone:"No se detectó voz. Intenta otra vez.",noSR:"Tu navegador no admite reconocimiento de voz. Escribe la frase:",tapMic:"Toca el micrófono y habla",
      rapidDone:(s,t)=>`${s} de ${t} correctas`,time:"Tiempo",scoreL:"Puntos",
      units:{1:"Unidad 1 · Fundamentos",2:"Unidad 2 · Verbos esenciales",3:"Unidad 3 · Preguntas e instrucciones",4:"Unidad 4 · Tiempo y secuencia",5:"Unidad 5 · En el servicio"},
      skills:{read:"Lectura",listen:"Escucha",speakS:"Habla",write:"Escritura",vocab:"Vocabulario",gram:"Gramática",conv:"Conversación"}},
  en:{eye:"Exercise library · Demo",title:"Exercise types",lead:"Each exercise type appears in different lessons across the course. Tap one to try it. All of them work in both directions.",
      check:"Check",next:"Continue",done:"Done",correct:"Correct",incorrect:"Correct answer:",tryAgain:"Try again",back:"Back",
      tap:"Tap the words in order",tapHint:"Tap a placed word to send it back.",
      ticket:"Read the ticket",dlg:"Choose your reply",map:"Tap the station",seqq:"Put the steps in order",rapid:"Tap the translation before time runs out",dict:"Listen and type",speak:"Say the phrase out loud",conjq:"Complete the table",
      heardNone:"No speech detected. Try again.",noSR:"Your browser doesn't support speech recognition. Type the phrase instead:",tapMic:"Tap the mic and speak",
      rapidDone:(s,t)=>`${s} of ${t} correct`,time:"Time",scoreL:"Score",
      units:{1:"Unit 1 · Foundations",2:"Unit 2 · Essential verbs",3:"Unit 3 · Questions & instructions",4:"Unit 4 · Time & sequence",5:"Unit 5 · On the floor"},
      skills:{read:"Reading",listen:"Listening",speakS:"Speaking",write:"Writing",vocab:"Vocabulary",gram:"Grammar",conv:"Conversation"}}
};
const T=()=>UI[native()];

/* ============ exercise catalogue ============
   Each exercise: meta (title/desc per native lang), unit, skills, and content per TARGET language. */
const EX=[
 {id:"order",unit:3,skills:["gram","write"],
  meta:{es:["Construir la frase","Toca las palabras en el orden correcto para formar una instrucción."],en:["Build the sentence","Tap the words in the right order to form an instruction."]},
  data:{en:{sentence:"Can you bring me the pan?",trans:"¿Me puedes traer la sartén?",extra:["plate","now"]},
        es:{sentence:"¿Me puedes traer la sartén?",trans:"Can you bring me the pan?",extra:["plato","ahora"]}}},
 {id:"ticket",unit:1,skills:["read","vocab"],
  meta:{es:["Leer la comanda","Una comanda real aparece. Responde preguntas sobre ella."],en:["Read the ticket","A real kitchen ticket comes in. Answer questions about it."]},
  data:{en:{q:"How many salmon on this ticket?",opts:["One","Two","Three","Four"],ans:1,
            ticket:{tbl:"TABLE 9",cov:"4 COVERS",items:[["2","Salmon","no butter"],["1","Ribeye","med rare"],["1","Pasta","gf"]],ft:"FIRE 7:42 PM · SERVER MARIA"}},
        es:{q:"¿Cuántos salmones hay en esta comanda?",opts:["Uno","Dos","Tres","Cuatro"],ans:1,
            ticket:{tbl:"MESA 9",cov:"4 PERSONAS",items:[["2","Salmón","sin mantequilla"],["1","Ribeye","término medio"],["1","Pasta","sin gluten"]],ft:"MARCHAR 7:42 PM · MESERA MARIA"}}}},
 {id:"dialogue",unit:5,skills:["conv","read"],
  meta:{es:["Diálogo en el servicio","El chef te habla. Elige la mejor respuesta y la conversación continúa."],en:["Shift dialogue","The chef talks to you. Pick the best reply and the conversation continues."]},
  data:{en:{who:"CHEF",me:"YOU",steps:[
          {them:["How long on table six?","¿Cuánto falta para la mesa seis?"],opts:[["Two minutes, chef.","Dos minutos, chef."],["Table six is nice.","La mesa seis es bonita."],["I don't have a table.","No tengo mesa."]],ans:0},
          {them:["Good. I need the salmon walking.","Bien. Necesito que el salmón salga ya."],opts:[["The salmon is swimming.","El salmón está nadando."],["Yes chef, salmon walking.","Sí chef, sale el salmón."],["Where is the salmon?","¿Dónde está el salmón?"]],ans:1},
          {them:["Behind you, hot pan.","Detrás de ti, sartén caliente."],opts:[["Thank you, I'm fine.","Gracias, estoy bien."],["Heard.","Escuchado."],["It is not hot.","No está caliente."]],ans:1}]},
        es:{who:"CHEF",me:"TÚ",steps:[
          {them:["¿Cuánto falta para la mesa seis?","How long on table six?"],opts:[["Dos minutos, chef.","Two minutes, chef."],["La mesa seis es bonita.","Table six is nice."],["No tengo mesa.","I don't have a table."]],ans:0},
          {them:["Bien. Necesito que el salmón salga ya.","Good. I need the salmon walking."],opts:[["El salmón está nadando.","The salmon is swimming."],["Sí chef, sale el salmón.","Yes chef, salmon walking."],["¿Dónde está el salmón?","Where is the salmon?"]],ans:1},
          {them:["Detrás de ti, sartén caliente.","Behind you, hot pan."],opts:[["Gracias, estoy bien.","Thank you, I'm fine."],["Escuchado.","Heard."],["No está caliente.","It is not hot."]],ans:1}]}}},
 {id:"map",unit:1,skills:["vocab","listen"],
  meta:{es:["Mapa de la cocina","Escucha el nombre de una estación y tócala en el plano."],en:["Kitchen map","Hear the name of a station and tap it on the floor plan."]},
  data:{en:{stations:[["walk-in","cámara fría",14,30],["prep","preparación",40,30],["the line","la línea",66,30],["the pass","el pase",88,30],["dish pit","lavado",14,74],["dry storage","almacén",40,74],["flat top","plancha",66,74],["expo","expo",88,74]]},
        es:{stations:[["cámara fría","walk-in",14,30],["preparación","prep",40,30],["la línea","the line",66,30],["el pase","the pass",88,30],["lavado","dish pit",14,74],["almacén","dry storage",40,74],["plancha","flat top",66,74],["expo","expo",88,74]]}}},
 {id:"seq",unit:4,skills:["gram","read"],
  meta:{es:["Ordenar los pasos","Usa primero, luego, después y por último para ordenar una receta."],en:["Order the steps","Use first, then, next and finally to put a recipe in order."]},
  data:{en:{labels:["First","Then","Next","Finally"],steps:["Heat the pan.","Add the oil.","Sear the fish.","Plate it and call it."]},
        es:{labels:["Primero","Luego","Después","Por último"],steps:["Calienta la sartén.","Agrega el aceite.","Sella el pescado.","Emplata y canta."]}}},
 {id:"rapid",unit:1,skills:["vocab","read"],
  meta:{es:["Frases de supervivencia · Ráfaga","Avisos que se gritan en la cocina. Relaciona rápido, con tiempo."],en:["Survival phrases · Rapid fire","Callouts you shout on the line. Match fast, against the clock."]},
  data:{en:{pairs:[["Behind!","¡Atrás!"],["Hot!","¡Caliente!"],["Corner!","¡Esquina!"],["Heard!","¡Escuchado!"],["Sharp!","¡Cuchillo!"],["Order up!","¡Sale pedido!"],["86 the soup","Se acabó la sopa"],["All day","En total"]]},
        es:{pairs:[["¡Atrás!","Behind!"],["¡Caliente!","Hot!"],["¡Esquina!","Corner!"],["¡Escuchado!","Heard!"],["¡Cuchillo!","Sharp!"],["¡Sale pedido!","Order up!"],["Se acabó la sopa","86 the soup"],["En total","All day"]]}}},
 {id:"dict",unit:2,skills:["listen","write"],
  meta:{es:["Dictado","Escucha una frase completa y escríbela."],en:["Dictation","Hear a full sentence and type it."]},
  data:{en:{text:"We need more plates.",trans:"Necesitamos más platos."},es:{text:"Necesitamos más platos.",trans:"We need more plates."}}},
 {id:"speak",unit:3,skills:["speakS"],
  meta:{es:["Práctica de pronunciación","Di la frase en voz alta. El micrófono comprueba lo que dijiste."],en:["Pronunciation practice","Say the phrase out loud. The mic checks what you said."]},
  data:{en:{text:"Where is the sauce?",trans:"¿Dónde está la salsa?"},es:{text:"¿Dónde está la salsa?",trans:"Where is the sauce?"}}},
 {id:"conj",unit:2,skills:["gram","write"],
  meta:{es:["Conjugar el verbo","Completa la tabla del verbo con los pronombres."],en:["Conjugate the verb","Fill in the verb table for each pronoun."]},
  data:{en:{verb:"to need",rows:[["I","need",true],["You","need",false],["He / She","needs",false],["We","need",false],["They","need",false]]},
        es:{verb:"necesitar",rows:[["Yo","necesito",true],["Tú","necesitas",false],["Él / Ella","necesita",false],["Nosotros","necesitamos",false],["Ellos","necesitan",false]]}}}
];

/* ============ hub ============ */
function setTarget(l){target=l;document.documentElement.lang=native();document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));renderHub();}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>setTarget(b.dataset.l));
function renderHub(){
  const t=T(); $("#h-eye").textContent=t.eye; $("#h-title").textContent=t.title; $("#h-lead").textContent=t.lead;
  $("#cards").innerHTML=EX.map(e=>`<button class="card" onclick="open('${e.id}')"><span class="tag">${t.units[e.unit]}</span><b>${e.meta[native()][0]}</b><p>${e.meta[native()][1]}</p><span class="skill">${e.skills.map(s=>`<span>${t.skills[s]}</span>`).join("")}</span></button>`).join("");
}
function goHub(){ $("#ex").classList.add("hide"); $("#hub").classList.remove("hide"); document.body.classList.remove("in-ex"); if(window.speechSynthesis)speechSynthesis.cancel(); if(timerId){clearInterval(timerId);timerId=null;} window.scrollTo(0,0); }
function open(id){
  const e=EX.find(x=>x.id===id), t=T();
  $("#hub").classList.add("hide"); $("#ex").classList.remove("hide"); document.body.classList.add("in-ex"); window.scrollTo(0,0);
  $("#exName").textContent=e.meta[native()][0]; $("#exUnit").textContent=t.units[e.unit];
  const sc=$("#screen"); sc.className="screen"; void sc.offsetWidth; $("#primary").classList.remove("hide");
  R[id](e.data[target], t, sc);
}
function setBar(state,title,text,btn,fn,disabled){
  $("#bar").className="bar"+(state?" "+state:""); $("#fb").innerHTML=title?`<b>${title}</b>${text?`<span>${text}</span>`:""}`:"";
  const p=$("#primary"); p.textContent=btn; p.onclick=fn; p.disabled=!!disabled;
}
const finishBar=(ok,t,word,sub)=>{$("#primary").classList.remove("hide");setBar(ok?"ok":"err", ok?t.correct:`${t.incorrect} ${word}`, sub||"", t.done, goHub);};
const choose=(el,cb)=>{document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");cb();};

/* ============ renderers ============ */
const R={};

/* 1. word order */
R.order=(d,t,sc)=>{
  const words=d.sentence.replace(/[¿?]/g,"").split(" "), tiles=shuffle([...words,...d.extra]);
  let placed=[];
  sc.innerHTML=`<div class="kicker">${t.tap}</div><div class="q">${d.trans}</div>
    <div class="slot" id="slot"></div><div class="tiles" id="tiles">${tiles.map((w,i)=>`<button class="tile" data-i="${i}" onclick="orderPick(${i})">${w}</button>`).join("")}</div><p class="muted">${t.tapHint}</p>`;
  window.orderPick=i=>{ if(placed.includes(i))return; placed.push(i); draw(); };
  function draw(){
    $("#slot").innerHTML=placed.map(i=>`<button class="tile" onclick="orderUn(${i})">${tiles[i]}</button>`).join("");
    document.querySelectorAll("#tiles .tile").forEach(b=>b.classList.toggle("used",placed.includes(+b.dataset.i)));
    $("#primary").disabled=placed.length===0;
  }
  window.orderUn=i=>{ placed=placed.filter(x=>x!==i); draw(); };
  setBar("", "", "", t.check, ()=>{
    const ok=strip(placed.map(i=>tiles[i]).join(" "))===strip(d.sentence);
    $("#slot").classList.add(ok?"ok":"err"); document.querySelectorAll(".tile").forEach(b=>b.onclick=null);
    speak(d.sentence); finishBar(ok,t,d.sentence,d.trans);
  }, true);
};

/* 2. ticket */
R.ticket=(d,t,sc)=>{
  let pick=null; const k=d.ticket;
  sc.innerHTML=`<div class="kicker">${t.ticket}</div>
    <div class="ticket"><div class="hd"><span>${k.tbl}</span><span>${k.cov}</span></div>${k.items.map(([n,i,m])=>`<div class="li"><span>${n} × ${i}</span></div><i class="li" style="display:block">${m?`<i>${m}</i>`:""}</i>`).join("")}<div class="ft">${k.ft}</div></div>
    <div class="q" style="font-size:19px">${d.q}</div>
    <div class="opts two">${d.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join("")}</div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b,()=>{pick=+b.dataset.i;$("#primary").disabled=false;}));
  setBar("", "", "", t.check, ()=>{
    document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.i===d.ans)b.classList.add("ok");else if(+b.dataset.i===pick)b.classList.add("err");b.classList.remove("sel");});
    finishBar(pick===d.ans,t,d.opts[d.ans]);
  }, true);
};

/* 3. dialogue */
R.dialogue=(d,t,sc)=>{
  let i=0, pick=null, misses=0;
  sc.innerHTML=`<div class="kicker">${t.dlg}</div><div class="chat" id="chat"></div><div class="opts" id="dopts"></div>`;
  function step(){
    const s=d.steps[i]; pick=null;
    $("#chat").insertAdjacentHTML("beforeend",`<div class="msg them"><span class="who">${d.who}</span>${s.them[0]}<span class="tr">${s.them[1]}</span></div>`);
    speak(s.them[0]);
    $("#dopts").innerHTML=s.opts.map((o,j)=>`<button class="opt" data-i="${j}"><span class="k">${j+1}</span><span>${o[0]}<br><span class="muted" style="font-size:13px">${o[1]}</span></span></button>`).join("");
    document.querySelectorAll("#dopts .opt").forEach(b=>b.onclick=()=>choose(b,()=>{pick=+b.dataset.i;$("#primary").disabled=false;}));
    setBar("", "", "", t.check, ()=>{
      const ok=pick===s.ans; if(!ok)misses++;
      document.querySelectorAll("#dopts .opt").forEach(b=>{b.disabled=true;if(+b.dataset.i===s.ans)b.classList.add("ok");else if(+b.dataset.i===pick)b.classList.add("err");b.classList.remove("sel");});
      $("#chat").insertAdjacentHTML("beforeend",`<div class="msg me"><span class="who">${d.me}</span>${s.opts[s.ans][0]}</div>`);
      speak(s.opts[s.ans][0]);
      const last=i===d.steps.length-1;
      setBar(ok?"ok":"err", ok?t.correct:`${t.incorrect} ${s.opts[s.ans][0]}`, s.opts[s.ans][1], last?t.done:t.next, last?goHub:()=>{i++;$("#dopts").innerHTML="";step();window.scrollTo(0,document.body.scrollHeight);});
    }, true);
  }
  step();
};

/* 4. kitchen map — rooms labeled in the target language; prompt is the native word + audio */
R.map=(d,t,sc)=>{
  const order=shuffle(d.stations).slice(0,4); let i=0, hits=0;
  const rooms=[[3,12,22,20],[29,12,22,20],[55,12,22,20],[81,12,16,20],[3,38,22,18],[29,38,22,18],[55,38,22,18],[81,38,16,18]];
  sc.innerHTML=`<div class="kicker">${t.map}</div><div class="target" id="tgt"></div><p class="muted" style="text-align:center;margin-bottom:14px" id="tgtTr"></p>
    <div class="map"><svg viewBox="0 0 100 60" id="floor"><rect width="100" height="60" fill="#f4f5f7"/>
      <text x="50" y="7" font-size="3.2" fill="#8a919c" text-anchor="middle" font-family="Inter,sans-serif" letter-spacing=".4">BACK OF HOUSE</text>
      ${d.stations.map((st,k)=>{const [x,y,w,h]=rooms[k];return `<g class="room" data-k="${k}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#fff" stroke="#d5d8de" stroke-width=".6"/><text x="${x+w/2}" y="${y+h/2+1.2}" font-size="${w<20?2.6:3}" font-weight="600" fill="#15181d" text-anchor="middle" font-family="Inter,sans-serif">${st[0]}</text></g>`}).join("")}
    </svg></div>
    <p class="muted" style="text-align:center" id="mapProg">1 / ${order.length}</p>`;
  function ask(){ $("#tgt").textContent=order[i][1]; $("#tgtTr").innerHTML=`<button class="play" onclick="speak('${order[i][0]}')">${SPK}</button>`; speak(order[i][0]); $("#mapProg").textContent=`${i+1} / ${order.length}`; }
  document.querySelectorAll(".room").forEach(g=>g.onclick=()=>{
    const r=g.querySelector("rect"), ok=d.stations[+g.dataset.k][0]===order[i][0];
    r.setAttribute("fill",ok?"#e6f4ec":"#fbecec"); r.setAttribute("stroke",ok?"#1f7a4d":"#b23a3a");
    if(ok)hits++;
    setTimeout(()=>{ if(!ok){r.setAttribute("fill","#fff");r.setAttribute("stroke","#d5d8de");} if(ok){ i++; if(i<order.length)ask(); else finishBar(hits===order.length,t,"",`${hits} / ${order.length}`); } },450);
  });
  ask(); setBar("", "", "", t.check, null, true); $("#primary").classList.add("hide");
};

/* 5. sequencing */
R.seq=(d,t,sc)=>{
  let cur=shuffle(d.steps.map((s,i)=>i)); if(cur.join()===d.steps.map((_,i)=>i).join())cur.reverse();
  sc.innerHTML=`<div class="kicker">${t.seqq}</div><div class="seq" id="seq"></div>`;
  function draw(){ $("#seq").innerHTML=cur.map((si,pos)=>`<div class="row" data-si="${si}"><em>${d.labels[pos]}</em><span>${d.steps[si]}</span><div class="mv"><button onclick="seqMove(${pos},-1)" ${pos===0?"disabled":""}>▲</button><button onclick="seqMove(${pos},1)" ${pos===cur.length-1?"disabled":""}>▼</button></div></div>`).join(""); }
  window.seqMove=(pos,dir)=>{ const j=pos+dir; [cur[pos],cur[j]]=[cur[j],cur[pos]]; draw(); };
  draw();
  setBar("", "", "", t.check, ()=>{
    let ok=true; document.querySelectorAll("#seq .row").forEach((r,pos)=>{const good=+r.dataset.si===pos; r.classList.add(good?"ok":"err"); if(!good)ok=false; r.querySelectorAll("button").forEach(b=>b.disabled=true);});
    finishBar(ok,t,"",d.labels.map((l,i)=>`${l}: ${d.steps[i]}`).join(" · "));
  });
};

/* 6. rapid fire */
let timerId=null;
R.rapid=(d,t,sc)=>{
  const q=shuffle(d.pairs); let i=0, score=0, tl=100;
  sc.innerHTML=`<div class="kicker">${t.rapid}</div><div class="score"><span>${t.time}</span><span id="rs">0 / ${q.length}</span></div><div class="timer"><i id="tf"></i></div><div class="big-word" id="bw"></div><div class="opts two" id="ro"></div>`;
  function ask(){
    if(i>=q.length)return end();
    tl=100; const cur=q[i], opts=shuffle([cur,...shuffle(d.pairs.filter(p=>p!==cur)).slice(0,3)]);
    $("#bw").textContent=cur[0]; $("#bw").style.animation="none"; void $("#bw").offsetWidth; $("#bw").style.animation="";
    $("#ro").innerHTML=opts.map(o=>`<button class="opt" style="justify-content:center">${o[1]}</button>`).join("");
    document.querySelectorAll("#ro .opt").forEach(b=>b.onclick=()=>{ const ok=b.textContent===cur[1]; b.classList.add(ok?"ok":"err"); if(ok)score++; $("#rs").textContent=`${score} / ${q.length}`; setTimeout(()=>{i++;ask();},300); document.querySelectorAll("#ro .opt").forEach(x=>x.disabled=true); });
    speak(cur[0]);
  }
  clearInterval(timerId);
  timerId=setInterval(()=>{ tl-=100/30; $("#tf").style.width=Math.max(0,tl)+"%"; if(tl<=0){ i++; ask(); } },100);
  function end(){ clearInterval(timerId); timerId=null; $("#bw").textContent=t.rapidDone(score,q.length); $("#ro").innerHTML=""; $("#tf").style.width="0"; finishBar(score>=q.length*0.75,t,"",`${t.scoreL}: ${score}`); }
  ask(); setBar("", "", "", t.check, null, true);
};

/* 7. dictation */
R.dict=(d,t,sc)=>{
  sc.innerHTML=`<div class="kicker">${t.dict}</div><div style="display:flex;justify-content:center;margin:10px 0 22px"><button class="play lg" onclick="speak('${d.text}')">${SPK.replace('width="20" height="20"','width="30" height="30"')}</button></div>
    <input class="field" id="dt" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">`;
  const f=$("#dt"); f.oninput=()=>$("#primary").disabled=!f.value.trim(); f.onkeydown=e=>{if(e.key==="Enter"&&!$("#primary").disabled)$("#primary").click();};
  setTimeout(()=>speak(d.text),300);
  setBar("", "", "", t.check, ()=>{ const ok=strip(f.value)===strip(d.text); f.classList.add(ok?"ok":"err"); f.disabled=true; finishBar(ok,t,d.text,d.trans); }, true);
};

/* 8. speaking */
R.speak=(d,t,sc)=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  sc.innerHTML=`<div class="kicker">${t.speak}</div><div class="panel" style="text-align:center"><div style="font-size:26px;font-weight:700;letter-spacing:-.02em">${d.text} <button class="play" onclick="speak('${d.text}')">${SPK}</button></div><p class="muted">${d.trans}</p></div>
    ${SR?`<button class="mic" id="mic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button><div class="heard" id="heard"></div><p class="muted" style="text-align:center" id="mhint">${t.tapMic}</p>`
        :`<p class="muted" style="margin-bottom:10px">${t.noSR}</p><input class="field" id="sp" autocomplete="off" placeholder="…">`}`;
  if(SR){
    const rec=new SR(); rec.lang=VOICE[target]; rec.interimResults=false; rec.maxAlternatives=3;
    $("#mic").onclick=()=>{ $("#mic").classList.add("live"); $("#heard").textContent=""; try{rec.start();}catch(e){} };
    rec.onresult=ev=>{ const alts=[...ev.results[0]].map(r=>r.transcript); $("#heard").textContent=`“${alts[0]}”`; const ok=alts.some(a=>strip(a)===strip(d.text)); finishBar(ok,t,d.text,d.trans); if(!ok){$("#mhint").textContent=t.tryAgain;} };
    rec.onend=()=>$("#mic").classList.remove("live");
    rec.onerror=()=>{ $("#mic").classList.remove("live"); $("#heard").textContent=t.heardNone; };
    setBar("", "", "", t.check, null, true); $("#primary").classList.add("hide");
  }else{
    const f=$("#sp"); f.oninput=()=>$("#primary").disabled=!f.value.trim();
    setBar("", "", "", t.check, ()=>{ const ok=strip(f.value)===strip(d.text); f.classList.add(ok?"ok":"err"); f.disabled=true; finishBar(ok,t,d.text,d.trans); }, true);
  }
};

/* 9. conjugation table */
R.conj=(d,t,sc)=>{
  sc.innerHTML=`<div class="kicker">${t.conjq}</div><div class="q">${d.verb}</div>
    <table class="conj">${d.rows.map(([p,v,given],i)=>`<tr><td>${p}</td><td>${given?`<span class="given">${v}</span>`:`<input data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false">`}</td></tr>`).join("")}</table>`;
  const ins=[...document.querySelectorAll(".conj input")];
  ins.forEach(f=>f.oninput=()=>$("#primary").disabled=!ins.every(x=>x.value.trim()));
  setBar("", "", "", t.check, ()=>{
    let ok=true; ins.forEach(f=>{ const good=strip(f.value)===strip(d.rows[+f.dataset.i][1]); f.classList.add(good?"ok":"err"); if(!good){ok=false;f.value=d.rows[+f.dataset.i][1];} f.disabled=true; });
    finishBar(ok,t,"",d.rows.map(r=>`${r[0]} ${r[1]}`).join(" · "));
  }, true);
};

setTarget("en");
</script>
